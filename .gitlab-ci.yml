stages:
  - test
  - deploy

cpp:test:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y build-essential cmake git ca-certificates pkg-config libopencv-dev nlohmann-json3-dev
  script:
    - cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
    - cmake --build cpp/build -j
    - ctest --test-dir cpp/build --output-on-failure --output-junit test-results.xml
  artifacts:
    when: always
    reports:
      junit: cpp/build/test-results.xml

python:test:
  stage: test
  image: python:3.13-bookworm
  before_script:
    - pip install uv
  script:
    - cd prototype
    - uv sync --locked
    - uv run python -m unittest discover -s tests -v

deploy-pages:
  stage: deploy
  script:
    - test -f public/index.html
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
