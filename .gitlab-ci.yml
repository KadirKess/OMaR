stages:
  - test

cpp:test:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y build-essential cmake git ca-certificates pkg-config libopencv-dev nlohmann-json3-dev
  script:
    - cd cpp
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build -j
    - ctest --test-dir build --output-on-failure --output-junit test-results.xml
  artifacts:
    when: always
    reports:
      junit: cpp/test-results.xml

python:test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  script:
    - cd prototype
    - uv sync --locked
    - uv run python -m unittest discover -s tests -v
