name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-test:
    name: C++ Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libopencv-dev nlohmann-json3-dev

      - name: Configure and build
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j

      - name: Run CTest
        run: ctest --test-dir cpp/build --output-on-failure

  python-test:
    name: Python Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies and run tests
        working-directory: prototype
        run: |
          uv sync --locked
          uv run python -m unittest discover -s tests -v
